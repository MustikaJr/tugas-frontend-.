<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Cafe Directory in Padang</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <header>
    <!-- flex digunakan pada navbar karena elemen hanya perlu disusun dalam satu arah. Awalnya ditumpuk dengan flex-col untuk layar HP (mobile-first), lalu disejajarkan dengan flex-row mulai layar md agar tidak sempit -->
    <nav class="flex flex-col md:flex-row justify-between items-center px-6 py-4 bg-blue-800 text-white">
      <a href="#" class="text-xl font-bold">Study Cafe Directory</a>
      <div class="flex gap-4 mt-2 md:mt-0">
        <a href="#daftar-cafe" class="hover:underline">Daftar Cafe</a>
        <a href="#about" class="hover:underline">About</a>
      </div>
    </nav>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-10">
    <section class="mb-10">
      <h1 class="text-3xl font-bold text-blue-900">Study Cafe Directory in Padang</h1>
      <p class="mt-2 text-gray-600">Ini adalah direktori study cafe di Padang. Data ini diambil dari berbagai sumber untuk membantu mahasiswa menemukan tempat belajar yang nyaman.</p>
    </section>

    <section id="daftar-cafe">
      <h2 class="text-2xl font-bold mb-6">Daftar Cafe</h2>
       <div class="flex flex-wrap gap-2 mb-6">
          <button data-kategori="semua" class="filter-btn bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Semua</button>
          <button data-kategori="Nugas" class="filter-btn bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Nugas</button>
          <button data-kategori="WFC" class="filter-btn bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">WFC</button>
          <button data-kategori="Diskusi" class="filter-btn bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Diskusi</button>
      </div>
      
      <!-- grid, bukan flex: kartu harus rata dalam baris dan kolom. Dibuat mobile-first (1 kolom), lalu menjadi 2 kolom dan 3 kolom saat layar membesar -->
      <div id="daftar-kartu" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>
  </main>

  <!-- mt-10: menggunakan margin top untuk memberi jarak luar agar footer tidak menempel dengan konten di atasnya -->
  <footer id="about" class="mt-10 px-6 py-6 text-center text-sm text-gray-500 border-t border-gray-200">
    <p>&copy; 2026 Study Cafe Directory in Padang. All rights reserved.</p> 
  </footer>

  <!-- Script data.js diletakkan di paling atas karena browser membaca file secara berurutan dari atas ke bawah sehingga data tersedia sebelum script lain menggunakannya -->
  <script src="data.js"></script>
  <script src="tampilan.js"></script>
  <script src="logika.js"></script>

</body>
</html>
